# Runs the test suite. Nothing here builds a report, fetches data or deploys
# anything - no network call, no secret, and nothing written back to the repo.
#
# Read before making this repository public: a workflow can publish something
# other than the page you meant. This one uploads nothing.

name: tests

# PAUSED 2026-09-19, on its first run. Assay imports Sextant's factor
# machinery from a sibling directory on purpose (assay/structure.py says why:
# a second copy drifts from the first). A GitHub runner has no sibling, so
# three test modules fail to import and 38 of 73 tests never run. Until that
# is settled, this runs only when somebody asks for it, rather than failing on
# every push or passing while testing half of what it claims.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy scipy pandas

      # The browser tests skip themselves when playwright or a chromium is
      # missing, so without this step the suite passes while proving less than
      # it looks like it proved. Installed on purpose, not for convenience.
      - name: Install playwright chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test
        run: python -m unittest discover -s tests
