# Runs the part of the test suite a runner can honestly run.
#
# Assay imports Sextant's factor machinery from a sibling directory on purpose
# (assay/structure.py says why: a second copy drifts from the first the moment
# either is corrected). A GitHub runner has no sibling, so test_structure,
# test_aggregation and test_report cannot import and do not run here. That was
# found on this workflow's first run, which failed.
#
# They are not skipped quietly. They run two other ways: Sextant's own CI runs
# all 342 of its tests on every push, which is where that machinery lives, and
# the full 73 run locally where the two projects are siblings - the run that
# matters before a publish. Checking Sextant out here would need a token with
# read access to a private repository, stored on a public one; that was
# considered on 2026-09-19 and declined as a poor trade for a second run of
# code Sextant already tests.
#
# What runs here: test_drift and test_browser_page, the latter against a real
# chromium, because its seven cover the page this repository actually serves
# and they skip themselves when chromium is missing.
#
# Since 2026-09-20, test_claims_ledger as well. It checks claims.json against
# README.md, docs/index.html and tests/test_browser_page.py, and needs no
# import from this project at all - comparing a JSON file against prose is
# text against text. That is the point of the ledger being a file: it moves
# two of the three links in the guard onto a runner that cannot import the
# engine. Its one engine-facing class skips itself here, loudly, for the same
# sibling reason as the four below.
#
# Nothing here fetches data, uploads an artifact, or writes back to the repo.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy scipy pandas

      # The browser tests skip themselves when playwright or a chromium is
      # missing, so without this step the suite passes while proving less than
      # it looks like it proved. Installed on purpose, not for convenience.
      - name: Install playwright chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test what does not need the sibling
        run: |
          python -m unittest tests.test_drift tests.test_browser_page \
                             tests.test_claims_ledger -v

      # A skip prints as a dot. The one class in test_claims_ledger that needs
      # the engine skips itself here, and a suite that goes green having never
      # run its only engine check is the exact shape of failure this project
      # has already been bitten by - seven browser tests that skipped
      # everywhere and looked like they passed. So it is named, not counted.
      - name: Say what did not run
        run: |
          echo "test_structure, test_aggregation, test_report and test_claims"
          echo "were NOT run. They import Sextant's factor machinery from a"
          echo "sibling checkout that does not exist on a runner. Sextant's"
          echo "own CI covers that machinery."
          echo ""
          echo "test_claims_ledger DID run, except its class"
          echo "TheLedgerAgreesWithTheEngine, which skipped for the same"
          echo "sibling reason. So what ran here is: claims.json against"
          echo "README.md, docs/index.html and tests/test_browser_page.py,"
          echo "plus claims.json against test_claims.py's own constants."
          echo "What did NOT run here is claims.json against the engine."
          echo ""
          echo "The chain is engine -> claims.json -> prose. Only the first"
          echo "link is missing on a runner; before 2026-09-20 two were."

